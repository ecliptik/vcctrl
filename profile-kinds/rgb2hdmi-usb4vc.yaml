# PROFILE KIND: rgb2hdmi-usb4vc
#
# A classic-Macintosh-shaped target (Mac Plus/ADB via USB4VC, RGB2HDMI ->
# HDMI-USB capture for video) -- PLACEHOLDER. Nothing in this repo has ever
# run one; docs/BOARD-IDENTITY.md sec. 4-6 already documents the Mac
# Plus/ADB board as board_id 3 in the EXISTING board-swap model (same
# usb4vc-uinput bridge as gateway2000, physically swapped in), and this
# kind template is that same known shape, scaffolded for the newer
# multi-profile machinery -- it asserts nothing new about the hardware.
#
# CREATION-TIME SCAFFOLDING ONLY -- see profile-kinds/vga-ps2.yaml's own
# comment on why nothing reads this file at daemon startup, ever.
#
# EXCLUSIVE HARDWARE, SAME AS vga-ps2: this kind uses usb4vc-uinput, the
# SAME one physical USB4VC/SPI bridge gateway2000 uses. vcctrld's startup
# guard (main()'s "EXCLUSIVE HARDWARE GUARD") will correctly REFUSE to
# build a profile of this kind while gateway2000 (or anything else
# declaring usb4vc-uinput) is already running -- that refusal is the
# correct behavior today, not a bug to route around, because the Mac Plus
# board is not physically present at the same time as the Gateway 2000's.
# A profile of this kind is meant to become the PRIMARY/root vcctrl.yaml
# when the board is physically swapped, not to coexist as an
# always-simultaneous sibling the way hdmi-usb profiles (modernpc) do.
# Real board-swap-aware profile selection (detecting which board is
# physically seated and only allowing that profile to build) is a bigger
# feature this placeholder does not attempt.
#
# UNMEASURED, PER docs/BOARD-IDENTITY.md sec. 6: the mouse -- the
# interface's WHOLE point on a Mac, unlike the keyboard-only g2k -- has
# never been tested against real ADB hardware through this daemon. The
# first real test should be a closed loop (move the mouse, capture a
# frame, confirm the cursor moved), not a keypress count. Treat every
# value below as a documented best guess against the existing board-swap
# code's own comments, not a measured fact about a profile of this kind.

capabilities:
  input:
    backend: usb4vc-uinput
    settings:
      vendor: 0x1209
      keyboard_product: 0xDEA1
      mouse_product: 0xDEA2
      pace_s: 0.012

  video:
    backend: v4l2-ffmpeg
    settings:
      # PLACEHOLDER -- an RGB2HDMI board's own HDMI-USB capture dongle,
      # by-id. UNMEASURED which chipset/mode this rig would actually use;
      # docs/BOARD-IDENTITY.md sec. 4 names RGB2HDMI -> HDMI-USB capture
      # as the intended path but nothing has run it here.
      device: /dev/v4l/by-id/REPLACE_ME-video-index0
      # DIGITAL SOURCE -- same reasoning as profile-kinds/hdmi-usb.yaml's
      # own comment: the capture point here is RGB2HDMI's HDMI OUTPUT, not
      # the original analog signal, so it has no analog sampling-noise
      # floor and "frozen" must not be read as "no signal" for it.
      analog: false

  leds:
    backend: none
    # NOT ps2-sysfs: docs/BOARD-IDENTITY.md sec. 5 is explicit -- "does
    # not exist -- no ADB equivalent". Reporting `unsupported` via a
    # boards_with_channel list that simply never names this board_id
    # would ALSO work, but `none` says the same thing without needing a
    # per-board exception list for a channel this whole kind never has.

  power:
    backend: none
    # NOT `kasa` pointed at gateway2000's own plug. docs/
    # BOARD-IDENTITY.md sec. 5 calls this "WRONG TARGET" in capital
    # letters for exactly this reason: with the Mac board installed,
    # cycling "the" plug still cuts power to the GATEWAY, a machine
    # nobody is looking at and possibly mid-run. The existing single-
    # profile code guards this with a boards: allowlist the plug refuses
    # outside of (see vcctrl.yaml's own `boards: [1]` and docs/
    # BOARD-IDENTITY.md sec. 5) -- `none` here is the same protection by
    # construction: a profile with no power capability at all cannot
    # accidentally power-cycle the wrong machine, board-scoped or not.
    # If this board ever gets its OWN dedicated plug, wire `kasa`
    # with a boards: list naming ONLY this board_id, never omit it.

  audio:
    backend: none        # "not planned" per docs/BOARD-IDENTITY.md sec. 4
  camera:
    backend: none
  # No USB gadget on this kind -- ADB over USB4VC, not a HID/mass-storage
  # gadget on the Pi's own USB-C port. See profile-kinds/hdmi-usb.yaml.
  msd:
    backend: none                  # usb-gadget-msd | none
  files:
    backend: none
    # "No packet driver, no FTP client, nothing to pull with. Working
    # hardware with no such channel -- not a fault." (existing targets:
    # entry for board_id 3, vcctrl.yaml)
  sysinfo:
    backend: none

  board:
    backend: usb4vc-runfile
    settings:
      file: /run/usb4vc/board.json

machine:
  label: REPLACE_ME
  kind: rgb2hdmi-usb4vc
  os: macos-classic
  keyboard: mac-plus
  mouse: relative
  native: {width: 512, height: 342}
  board_id: 3

targets:
  - board_id: 3
    name: REPLACE_ME
    native: {width: 512, height: 342}
    leds: unsupported
    transfer: unsupported
    keyboard: mac-plus
