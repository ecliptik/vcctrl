# vcctrl configuration for profile 'macintosh' -- generated by tools/new-profile.py from profile-kinds/rgb2hdmi-usb4vc.yaml.
#
# EVERY "REPLACE_ME" BELOW IS A REAL VALUE THIS FILE STILL NEEDS
# before this profile can actually run -- device paths, plug
# addresses, board names. This file is complete and self-
# contained once they are filled in; nothing at runtime reads
# profile-kinds/rgb2hdmi-usb4vc.yaml again (see that file's own comment).
#
# NOT gitignored by name the way vcctrl.yaml/vcctrl-modernpc.yaml
# are (see .gitignore and vcctrl-repo-conventions) -- if this
# profile's own settings turn out to hold anything host-real
# (addresses, credentials), add it to .gitignore explicitly
# before committing, the same way modernpc's config was.
#
# Deploy with: pi/deploy.sh --profile macintosh
# (installs pi/files/vcctrld-<name>.service, a second vcctrld
# process pointed at this file via VCCTRL_CONFIG -- see
# pi/install.sh's install_profile().)

version: 1

daemon:
  # THIS PROFILE'S OWN NAME (daemon/vcctrld.py's Instance.name).
  # Only actually READ from the file that ends up loaded as the
  # ROOT vcctrl.yaml (discover_profiles() derives a SIBLING's
  # name from its filename instead, per that function's own
  # comment) -- harmless, correct documentation either way.
  profile_name: macintosh

capabilities:
  input:
    backend: usb4vc-uinput
    settings:
      vendor: 0x1209
      keyboard_product: 0xDEA1
      mouse_product: 0xDEA2
      pace_s: 0.012

  video:
    backend: v4l2-ffmpeg
    settings:
      # PLACEHOLDER -- an RGB2HDMI board's own HDMI-USB capture dongle,
      # by-id. UNMEASURED which chipset/mode this rig would actually use;
      # docs/BOARD-IDENTITY.md sec. 4 names RGB2HDMI -> HDMI-USB capture
      # as the intended path but nothing has run it here.
      device: /dev/v4l/by-id/REPLACE_ME-video-index0
      # DIGITAL SOURCE -- see profile-kinds/rgb2hdmi-usb4vc.yaml's own
      # comment: the capture point is RGB2HDMI's HDMI output, not the
      # original analog signal, so "frozen" must not be read as no signal.
      analog: false

  leds:
    backend: none
    # NOT ps2-sysfs: docs/BOARD-IDENTITY.md sec. 5 is explicit -- "does
    # not exist -- no ADB equivalent". Reporting `unsupported` via a
    # boards_with_channel list that simply never names this board_id
    # would ALSO work, but `none` says the same thing without needing a
    # per-board exception list for a channel this whole kind never has.

  power:
    backend: none
    # NOT `kasa` pointed at gateway2000's own plug. docs/
    # BOARD-IDENTITY.md sec. 5 calls this "WRONG TARGET" in capital
    # letters for exactly this reason: with the Mac board installed,
    # cycling "the" plug still cuts power to the GATEWAY, a machine
    # nobody is looking at and possibly mid-run. The existing single-
    # profile code guards this with a boards: allowlist the plug refuses
    # outside of (see vcctrl.yaml's own `boards: [1]` and docs/
    # BOARD-IDENTITY.md sec. 5) -- `none` here is the same protection by
    # construction: a profile with no power capability at all cannot
    # accidentally power-cycle the wrong machine, board-scoped or not.
    # If this board ever gets its OWN dedicated plug, wire `kasa`
    # with a boards: list naming ONLY this board_id, never omit it.

  audio:
    backend: none        # "not planned" per docs/BOARD-IDENTITY.md sec. 4
  camera:
    backend: none
  # No USB gadget on this kind -- ADB over USB4VC. See vcctrl-modernpc.yaml
  # (hdmi-usb kind) for a profile that DOES have one.
  msd:
    backend: none                  # usb-gadget-msd | none
  files:
    backend: none
    # "No packet driver, no FTP client, nothing to pull with. Working
    # hardware with no such channel -- not a fault." (existing targets:
    # entry for board_id 3, vcctrl.yaml)
  sysinfo:
    backend: none

  board:
    backend: usb4vc-runfile
    settings:
      file: /run/usb4vc/board.json

machine:
  label: REPLACE_ME
  kind: rgb2hdmi-usb4vc
  os: macos-classic
  keyboard: mac-plus
  mouse: relative
  native: {width: 512, height: 342}
  board_id: 3

targets:
  - board_id: 3
    name: REPLACE_ME
    native: {width: 512, height: 342}
    leds: unsupported
    transfer: unsupported
    keyboard: mac-plus
