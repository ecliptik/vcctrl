name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No hardware required: the suite runs entirely against
      # tests/test-config.yaml, never a real vcctrl.yaml. It does shell out
      # to a headless browser (tests/test_core.py looks for `chromium`,
      # `chromium-browser`, then `google-chrome` in that order -- the
      # GitHub-hosted ubuntu-latest runner ships `google-chrome`
      # pre-installed, so nothing extra to install there) and to ffmpeg
      # (for the audio/video capability tests).
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run the test suite
        run: pytest tests/ -v
