# vcctrl configuration -- EXAMPLE.
#
# Copy to vcctrl.yaml (which is gitignored) and edit. vcctrl runs without this
# file at all, on built-in defaults; every key below is optional, and what you
# leave out keeps its default.
#
# Precedence:   built-in defaults  <  this file  <  VCCTRL_* env  <  CLI flag
#
# Search order, first hit wins:
#   $VCCTRL_CONFIG
#   ./vcctrl.yaml            (repo root)
#   ~/.config/vcctrl/vcctrl.yaml
#   /opt/vcctrl/vcctrl.yaml  (on the daemon host, installed by pi/deploy.sh)
#
# Unknown keys are an ERROR, not a shrug. A typo'd key that silently leaves a
# subsystem unconfigured is worse than a refusal that names the typo.
#
# `vcctrl config check` validates this file. `vcctrl config show` asks the
# RUNNING DAEMON what it actually resolved, which is a different question and
# the one worth asking when something is behaving oddly.

version: 1

rig:
  name: example-rig

# ---------------------------------------------------------------------------
# The control host: the machine you run bin/vcctrl from.
# ---------------------------------------------------------------------------
control:
  # ssh destination for the daemon host. A Host entry in ~/.ssh/config is the
  # tidiest way to carry the user and key.
  daemon_host: vcctrl-pi

  # Base URL of the daemon's web UI. Must be the HTTPS name: the daemon binds
  # loopback only and is reached through a proxy, so plain http is not merely
  # discouraged, it is unreachable.
  web: https://vcctrl-pi.example.ts.net

  shots_dir: /tmp/vcctrl-shots

  # Optional. How the TARGET pulls files from you -- for a DOS target this is
  # usually FTP, because the client fits on a floppy and is already there.
  fileserver:
    kind: ftp
    host: 192.0.2.10
    port: 2121
    user: EXAMPLE_USER
    # NEVER a literal password. This names an environment variable, which is
    # read at the moment it is needed. A password in this file is a password in
    # your shell history, your backups, and eventually your public repository.
    password_env: VCCTRL_FTP_PASSWORD

# ---------------------------------------------------------------------------
# The daemon host: paths and listeners on the machine running vcctrld.
# ---------------------------------------------------------------------------
daemon:
  prefix: /opt/vcctrl
  state_dir: /var/lib/vcctrl
  socket: /run/vcctrl.sock

  # Where the USB4VC application lives, if you use one. These are read, never
  # written, except by the two patches in tools/ which are applied explicitly.
  usb4vc:
    app_dir: /home/pi/usb4vc/rpi_app
    debug_log: /home/pi/usb4vc/usb4vc_debug_log.txt
    board_file: /run/usb4vc/board.json

  web:
    # LOOPBACK ONLY, and this is a security property rather than a default.
    # Nothing listens on the network directly; a proxy terminates TLS and
    # forwards here, so the proxy remains the authentication boundary.
    bind: 127.0.0.1
    port: 8080
    # The daemon's own TLS listener, advertising http/1.1 only. A WebSocket
    # does not survive an HTTP/2 negotiation, which is why this exists
    # separately from the proxied port.
    tls_port: 8443
    tls:
      # tailscale | files | none
      #   tailscale -- `tailscale serve` terminates TLS with a real cert for
      #                the machine's MagicDNS name. NOTE this publishes that
      #                name to public Certificate Transparency logs. That is
      #                inherent to any publicly-trusted certificate, not a
      #                choice this project makes, and it is not reversible.
      #   files     -- your own cert and key at the paths below
      #   none      -- plain http. AudioWorklet, clipboard write and WebRTC do
      #                not exist on a non-secure origin, in any browser, and
      #                each reads as "broken in Safari" when the real cause is
      #                the scheme.
      provider: tailscale
      cert: /var/lib/vcctrl/tls.crt
      key: /var/lib/vcctrl/tls.key

  # A SEPARATE, ISOLATED PROCESS -- daemon/vcweb_public.py, not a mode flag
  # on the block above. It shares no code with vcctrld's command dispatch,
  # has no /cmd route at all, and never implements the input-carrying /ws
  # (see vcweb_public.py's module docstring). It gets everything it shows by
  # polling THIS daemon's read-only endpoints over loopback at a fixed low
  # rate, so public viewer count never adds load here.
  #
  # DOCUMENTATION ONLY below -- vcweb_public.py is a standalone script and
  # reads these three values from its environment, not from this file:
  #   bind         -> VCCTRL_PUBLIC_BIND   (default 127.0.0.1)
  #   port         -> VCCTRL_PUBLIC_PORT   (default 8091)
  #   upstream_port -> VCCTRL_WEB_PORT      (default 8080, must match `port`
  #                    above so the poller reaches the right listener)
  # A second YAML loader for one small script is a second place for "what did
  # the running process actually resolve" to disagree with a file on disk;
  # env vars in its systemd unit are the one source of truth until this
  # process grows enough settings to need more.
  #
  # EXPOSURE: for now this is reachable over the tailnet only (the same
  # `tailscale serve` boundary as the block above, or the plain tailnet IP).
  # Making it reachable from the public internet is a separate, later,
  # manual `tailscale funnel` step the operator takes after reviewing it
  # over the tailnet -- nothing here or in vcweb_public.py does that itself.
  #
  # THAT FUNNEL STEP USES PORT 10000 ON THE TAILSCALE SIDE, NOT 8091 --
  # `port` below is only where the process itself listens (loopback only,
  # proxied in by `tailscale serve`/`funnel`); the EXTERNAL port funnel
  # answers on is a separate number, and not every port is eligible. A
  # tailnet's ACL grants Funnel only on specific ports (node capability
  # `funnel-ports`, check via `tailscale status --json` -> Self.CapMap;
  # commonly 443, 8443, 10000 by Tailscale's own default). `tailscale
  # funnel` on a port outside that grant reports success locally with no
  # warning at all and is simply never reachable from outside the tailnet
  # -- see pi/install.sh's install_public() for the long version of this,
  # measured the hard way. 10000 is the default port not already used by
  # the private KVM (443, 8443).
  web_public:
    bind: 127.0.0.1
    port: 8091
    upstream_port: 8080

  # THE MIRROR'S OWN TAILNET IDENTITY. vcweb_public.py is proxied by a
  # SECOND, unprivileged tailscaled instance (pi/install.sh's
  # install_tailscaled_ro(), unit pi/files/tailscaled-ro.service), not by
  # sharing the control node's own hostname on an alternate port -- gives
  # the mirror a hostname of its own (e.g. https://<ro-hostname>.<tailnet>.
  # ts.net/) with its own ACL/exposure surface, decoupled from the control
  # node's. Not a container: a second tailscaled is the standard supported
  # way to get a second tailnet identity on one host, and vcweb_public.py
  # already has every isolation property a container would add on top (see
  # its own module docstring: no import of vcctrld.py/vcweb.py, no /cmd
  # route, no /ws).
  #
  # `tailscale up` for this instance is a ONE-TIME, MANUAL operator step
  # (Tailscale admin console: a tag, an authkey scoped to it, and a
  # funnel-ports ACL grant for that tag) -- never scripted, matching the
  # fact that this repo never scripts `tailscale up` for the primary
  # instance either. Until that step has been run once, `install_public()`
  # still installs and starts everything else; the mirror simply is not
  # yet reachable under its own hostname.
  #
  # FUNNEL-PORTS ACL IS GRANTED PER NODE, NOT PER TAILNET -- a freshly
  # tagged node's own CapMap is not assumed to grant the same ports the
  # primary node's does (that grant was read off the EXISTING `usb4vc`
  # node, not a Tailscale default). Check
  # `tailscale --socket=/run/tailscale-ro/tailscaled.sock status --json`
  # -> Self.CapMap on the live instance before relying on a port, the same
  # "checked, not assumed" discipline the :10000 note above exists for.

# ---------------------------------------------------------------------------
# Capabilities. Each names a backend; `none` is always available and always
# honest -- a `none` backend answers "not configured", never a zero, never a
# false, and never a plausible default.
#
# Per-backend `settings` are not schema-checked yet. That is a known gap, it is
# closed when the backends land, and it is written down rather than left for
# someone to discover by typo.
# ---------------------------------------------------------------------------
capabilities:
  input:
    backend: usb4vc-uinput        # usb4vc-uinput | uinput | none
    settings:
      # USB4VC classifies a uinput device by what it advertises; these are
      # protocol facts about that bridge, not preferences.
      vendor: 0x1209
      keyboard_product: 0xDEA1
      mouse_product: 0xDEA2
      pace_s: 0.012

  leds:
    backend: ps2-sysfs            # ps2-sysfs | none
    settings:
      # Boards that have a PS/2 LED return channel at all. A board not listed
      # here reports `unsupported`, which is working hardware, not a fault.
      boards_with_channel: [1]

  power:
    backend: kasa-legacy          # kasa-legacy | shell | none
    settings:
      host: 192.0.2.20
      port: 9999
      alias: example-plug
      # How long mains stays off during a power cycle.
      cycle_off_s: 15.0
      # WHICH BOARD(S) THIS PLUG IS WIRED TO. Not a preference -- a safety
      # fact. `on`/`off`/`cycle` refuse when the INSTALLED board is not in
      # this list, rather than running unconditionally. Required because a
      # rig can carry more than one USB4VC protocol board over its life
      # without carrying more than one smart plug: this example's plug is
      # the PC's, and if a Macintosh board were seated on the same rig,
      # `power cycle` would otherwise still cut the PC's mains -- a machine
      # nobody asked about and possibly mid-run on a peer session. See
      # docs/BOARD-IDENTITY.md sec. 5.
      #
      # An unmapped or unknown board is refused, never assumed to be this
      # one -- same discipline as `leds.settings.boards_with_channel` below.
      # `power state` is unaffected: it is a read, never gated, and must
      # keep answering even when the installed board is unknown.
      boards: [1]
    #
    # The `shell` backend runs your own commands instead, for any plug this
    # project will never support -- a Zigbee bridge, a relay board, a PDU with
    # a web form, a person with a switch:
    #
    #   backend: shell
    #   settings:
    #     on_cmd:    my-plug on
    #     off_cmd:   my-plug off
    #     state_cmd: my-plug state     # MUST print exactly `on` or `off`
    #     timeout_s: 20
    #
    # Anything else on stdout is read as "could not answer", NOT as off.
    # Those are different facts: "off" makes the harness treat every LED
    # reading as belonging to a powered-down machine, and a script that
    # printed a warning has not told you the plug is off.

  video:
    backend: v4l2-ffmpeg          # v4l2-ffmpeg | none
    settings:
      # BY NAME, never by index. Both defaults happened to be right once, and
      # that was luck: a different enumeration order can put an HDMI OUTPUT at
      # the index you expected, and the daemon would capture silence from it
      # without ever saying anything was wrong.
      device: /dev/v4l/by-id/usb-EXAMPLE_CAPTURE-video-index0

  audio:
    backend: alsa-ffmpeg          # alsa-ffmpeg | none
    settings:
      device: hw:CARD=EXAMPLE,DEV=0
      channels: 2
      rate: 48000
      # Bitrate for the Opus side-stream (`/wsaudio?codec=opus`), which the
      # public mirror's page prefers over raw PCM -- ~12x less bandwidth per
      # listener at the default. Passed straight to ffmpeg's -b:a; the
      # encoder only runs while at least one Opus listener is connected.
      opus_bitrate: 128k

  # A SECOND, independent camera pointed at the physical target rather than
  # its captured video signal -- optional, unlike `video`/`audio` above which
  # every rig has. Defaults to `none` here on purpose: an absent `backend:`
  # key does NOT mean disabled in this schema (see Registry._resolve_backend
  # in daemon/vcctrld.py) -- it falls back to the default backend below, so a
  # rig with no second camera that left this block out entirely would still
  # spin ffmpeg against /dev/video0 forever. Set `backend: v4l2-ffmpeg` and
  # fill in the real by-id device only on a rig that actually has one.
  camera:
    backend: none                 # v4l2-ffmpeg | none
    settings:
      # Same by-id discipline as `video` above -- doubly so here, since a rig
      # with this enabled has TWO UVC devices that can renumber independently
      # of each other.
      device: /dev/v4l/by-id/usb-EXAMPLE_CAMERA-video-index0

  # Putting a file ONTO the target. The backend names the METHOD; `targets:`
  # says which attached machines it applies to, so a rig can have one of each.
  #
  # `mtcp-ftp` means the target pulls from the server named in
  # `control.fileserver` using its own FTP client -- the DOS side always
  # initiates, because mTCP's client cannot be pushed to.
  files:
    backend: mtcp-ftp             # mtcp-ftp | none
    settings:
      # THE ADDRESS BAKED INTO THE CARD'S BAT. Not "where the server is" --
      # the literal string a batch file on a CF card will dial. The generator
      # that writes that BAT and the liveness check that probes it read THIS
      # key, so the two cannot drift; a check that dialled anything else would
      # prove a server is up and prove nothing about the address the target
      # calls, and would fail after the confirmation and after the reboot.
      #
      # NOTE this is NOT `control.fileserver`. That block is the CONTROL
      # host's server, which the card's GET.BAT and PUT.BAT already name and
      # which collects every log. This is a second server, on the daemon host,
      # so a file picked in the browser never crosses a host boundary.
      # Keeping them separate is also the recovery path: if this address goes
      # stale, the control host's endpoint is still how you fix the card.
      #
      # PICK THE INTERFACE DELIBERATELY. A host with two addresses on one
      # subnet -- a wired and a wireless one, both DHCP -- has two candidates,
      # and the one not named here is an address the target will never dial.
      # A machine that comes up on the other is entirely healthy and entirely
      # unreachable from the card. Prefer the one the routing table already
      # picks for the target's subnet (`ip route get <target>`), so the server
      # is not fighting the kernel about which way replies leave.
      #
      # THE OTHER INTERFACE STAYS UP AND IS DELIBERATELY UNUSED. Say so where
      # somebody debugging will read it: a daemon host answering perfectly on
      # the address you did NOT choose, while the target dials the one you
      # did, is a healthy machine that looks dead. The next person will find
      # that interface up and wonder why it was passed over, and "we picked
      # the one the routing table already prefers for the target's subnet" is
      # the answer they need in front of them.
      #
      # THIS ADDRESS MUST ALSO BE THE SERVER'S BIND ADDRESS AND ITS PASSIVE
      # MASQUERADE ADDRESS. Not three settings that happen to agree -- one
      # value read three times. FTP passive mode advertises an address in its
      # reply, so a masquerade auto-detected from "the first global address"
      # can name the OTHER interface: the target connects to the control port
      # here and is then told to open its data connection somewhere else.
      # Control succeeds, data hangs. That is a half-working transfer, and it
      # is the worst shape to debug on a machine whose only console is the
      # screen you are capturing.
      target_host: 192.0.2.11     # the daemon host, on the target's subnet
      target_port: 2121
      # Where a file SENT to the target lands on it. Deliberately NOT the
      # directory the program under test lives in: a file that collides with
      # a name in there replaces it silently, and that directory holds the
      # batch files every measured run calls.
      #
      # The words are from the TARGET's point of view and they invert across
      # the wire -- the server's stage/ feeds the target's IN, and the
      # target's OUT feeds the server's incoming/. Terse on purpose, so
      # nobody reads them as matching the server's names.
      dest: "C:\\XFER\\IN"
      # Where the target leaves files FOR US, and the only directory
      # `get-file` will read or fetch from.
      #
      # LEAVE IT UNSET UNLESS YOU MEAN IT, the same advice `dest` gets and for
      # a stronger reason: unset, this is DERIVED as the sibling of `dest`, so
      # a rig that moves its incoming directory takes its outgoing one with
      # it. Setting one and not the other is how the pair silently splits --
      # and three things read this value (the MD and the default inside
      # VCLIST.BAT, the DIR that becomes the file picker, and the path typed
      # at VCCHK for every fetch), so a second opinion about it is a second
      # thing to drift.
      #
      # NOTHING IS EVER DELETED FROM HERE by vcctrl. It is emptied by a
      # person.
      # out_dir: "C:\\XFER\\OUT"
      # The FTP login's home on THIS host. It holds stage/ (the target GETs
      # from here) and incoming/ (the target PUTs its verification copy back
      # here) -- the card's batch files `cd` to both by those names.
      #
      # Four more directories are created as SIBLINGS of this one, deliberately
      # outside it: bytes still arriving, per-file checksums, and the same
      # pair for files fetched back off the target. A partial file inside the
      # served root is a truncated transfer waiting to happen, because the
      # target fetches by name and a name that exists is a name it will fetch;
      # and a file fetched OFF the target has to leave incoming/ for the
      # opposite reason -- incoming/ is inside the root, so anything left
      # there is served and is overwritable by the target itself. Being
      # siblings also keeps them on one filesystem with stage/, which is what
      # makes both promotions an atomic rename.
      root_dir: /var/lib/vcctrl/fileserver

  board:
    backend: usb4vc-runfile       # usb4vc-runfile | static | none
    settings:
      # /run is tmpfs, which is why this file is trusted: the record cannot
      # outlive the boot that wrote it, so a stale value reading as current is
      # structurally impossible rather than merely unlikely.
      file: /run/usb4vc/board.json
    #
    # `static` is for a rig with one permanently-installed board and nothing
    # to ask, where the alternative is `unknown` forever:
    #
    #   backend: static
    #   settings: {board_id: 1, name: My Board}
    #
    # It reports source `configured`, never `status-file`, and says in its own
    # reason field that it cannot notice a board swap. That distinction is the
    # point: an assertion dressed up as a detection is worse than no detection,
    # because it resembles evidence.

# ---------------------------------------------------------------------------
# Targets: which machine each protocol board implies.
#
# `unknown` must stay a real answer. A rig that cannot tell which board is
# installed says so; it does not fall back to the most likely one.
# ---------------------------------------------------------------------------
targets:
  - board_id: 1
    name: Example PC
    native: {width: 640, height: 480}
    # supported | unsupported | unknown -- a WORD, not a boolean. `false`
    # collapses "this machine has no such channel" into "the channel is
    # broken", and those need different responses from a person.
    leds: supported
    # Can this machine be sent a file? Same three words, same reason. This
    # one is `supported` because the machine has a packet driver and an FTP
    # client; the capability still refuses if no file server is answering,
    # which is a different fact and reported under a different word.
    transfer: supported
    # Which KEYBOARD the web KVM draws for this machine -- a layout id the
    # page resolves against its own table, not a machine name and not a
    # boolean. The daemon never draws a key and deliberately knows nothing
    # about what is on one; it only publishes which layout this board asks
    # for. That split is what lets a page older than its config say "board 1
    # asks for a layout I do not have" instead of showing the wrong keyboard.
    #
    # Omitting it is NOT "use the default". A configured targets: list
    # replaces the built-in table wholesale, so a row with no `keyboard:`
    # means this board has no declared layout and the page draws none. That
    # is deliberate: a Macintosh drawn as a PC is a picture of a keyboard
    # that is not in the building.
    keyboard: pc-at-101

  - board_id: 3
    name: Example Macintosh
    native: {width: 512, height: 342}
    leds: unsupported
    # No packet driver, no FTP client, nothing to pull with. This is working
    # hardware with no such channel -- the transfer control is greyed and says
    # so, rather than being offered and failing. A Macintosh could gain this
    # later: it would need `transfer: supported` here AND a backend under
    # `capabilities.files` implementing its own answer to "how do you know it
    # arrived". The plumbing is shared; that proof is not.
    transfer: unsupported
    # A different keyboard, not a subset of the PC's: no function row, no
    # arrows, no Home/End/PgUp/PgDn, and Command and Option where a PC has
    # Alt and Ctrl.
    keyboard: mac-plus

# ---------------------------------------------------------------------------
# Harness. See docs/HARNESS-STANDARD.md; project-specific parameters belong in
# a profile, not here.
# ---------------------------------------------------------------------------
harness:
  profile: profiles/example.yaml
  timing:
    # RIG physics: how many keystrokes the target's BIOS buffer holds. Measure
    # yours; overflowing it does not merely drop keys, it flushes the surplus
    # into whatever command line is typed next, minutes later.
    #
    # Deliberately NOT here: the boot-menu window, which is target physics and
    # belongs in the profile; and the menu keystroke budget, which is DERIVED
    # from both and is computed and asserted rather than configured. A derived
    # value presented as configuration is a value with its reasoning deleted.
    kbd_buffer_keys: 15
