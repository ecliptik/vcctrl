# A static snapshot of a REAL harness profile's shape, for
# test_sweep_denied_section_is_optional (tests/test_core.py).
#
# WHY THIS EXISTS. That test exists to prove `preflight()`/`--list` don't
# require a `denied` key -- and per its own docstring, it deliberately
# checks this against a conf "shaped like the REAL one", not an invented
# fixture, because an invented fixture that always happens to agree with
# the code under test proves nothing (see `test_absent_key_is_not_a_value`,
# same file, for the failure mode this guards against from the other
# direction).
#
# Before 2026-09-11 this file didn't exist -- the test read
# profiles/doskutsu.yaml LIVE, off this repo's own fallback path, to get
# that "real shape" property. That coupling broke the day doskutsu's
# profile moved into doskutsu's own repo (matching dosags's/dossage's
# per-repo-profile convention -- see sdl-dos-ports' own
# docs/hardware-testing.md), because the TEST suite deliberately never
# reads this machine's real vcctrl.yaml (see tests/test-config.yaml's own
# header) and has no way to know where a moved profile now lives.
#
# So: a snapshot, not a live read. This is a real profile's real shape
# (copied from doskutsu's profiles/doskutsu.yaml as it stood on
# 2026-09-11, right after that repo's own env-var-naming fix), kept only
# for the ONE property this test needs -- no `denied:` key anywhere --
# and deliberately NOT kept in sync with doskutsu's actual profile going
# forward. If doskutsu's profile ever legitimately grows a `denied`
# section, this fixture stays denied-key-free on purpose; that's a
# property of "a real profile can validly look like this", not a claim
# that this IS doskutsu's current profile.

version: 1
name: doskutsu

target:
  dir: "C:\\DOSKUTSU"
  configs: "CFGS"
  ftp_put: "C:\\MTCP\\PUT.BAT"
  exe: "DOSKUTSU.EXE"
  default_cfg: "OPL3.CFG"
  cfg_dest: "DOSKUTSU.CFG"
  env_clear_cmd: "CALL CLRENV"
  default_replay: "QA.TAS"
  default_seed: "12345"
  sweep_entry_cmd: "QA"
  card_overrides:
    mach64:
      pin_native_mode: "0"
  profile_witness:
    variable: BLASTER
    value: "A220 I7 D3 P330 T3"
    proves: "NOT the NET profile (a sound profile is loaded)"
    direction: one-way
  env:
    replay: DOS_PORT_TAS_REPLAY
    seed: DOS_PORT_TAS_PRNG_SEED
    auto_exit_tick: DOS_PORT_TAS_AUTO_EXIT_TICK
    log_tag: DOS_PORT_LOG_TAG
    pin_native_mode: DOS_PORT_PIN_NATIVE_MODE
    shot_ticks: DOS_PORT_SHOT_TICKS
    capture_flag: DKTCAP

timing:
  menu_window_s: 14

machines:
  "1": {tag: "G", name: "Pentium OverDrive 83"}
  "2": {tag: "A", name: "Am5x86-133"}
  "3": {tag: "6", name: "486DX2-66"}
  "4": {tag: "5", name: "486DX2-50"}

sweeps:
  ADIAG:
    cells: 4
    timeout_min: 22
    measured: "10m16s DX2-66"
    tags: ["A0", "AM", "AS", "AX"]
  DEEP:
    cells: 2
    timeout_min: 17
    measured: "6m40s POD"
    tags: ["C4D", "51D"]
  FINE:
    cells: 2
    timeout_min: 12
    measured: "5m25s DX2-66"
    tags: ["C4F", "51F"]
  LEV:
    cells: 3
    timeout_min: 17
    measured: "6m54s POD"
    tags: ["L0", "LA", "LP"]
  MINE:
    cells: 2
    timeout_min: 12
    measured: "4m49s POD"
    tags: ["MN", "MF"]
  PUMP:
    cells: 4
    timeout_min: 23
    measured: "not yet measured -- budget taken from RB, same 4-cell shape"
    tags: ["PU0", "PUA", "PU0B", "PUAB"]
  RB:
    cells: 4
    timeout_min: 23
    measured: "9m11s POD / 11m31s DX2-50"
    tags: ["R4", "R4B", "R3", "R5"]
  TAB:
    cells: 3
    timeout_min: 18
    measured: "7m59s DX2-66"
    tags: ["T0", "TB", "TC"]
  WC:
    cells: 3
    timeout_min: 18
    measured: "7m11s POD"
    tags: ["W0", "WA", "WB"]
