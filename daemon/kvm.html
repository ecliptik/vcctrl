<!doctype html>
<meta charset="utf-8">
<title>vcctrl-kvm</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg:#14161a; --panel:#1c1f26; --line:#2b303a; --fg:#dfe3ea;
    --dim:#8a93a3; --ok:#5ac27a; --warn:#e0b341; --bad:#e05c5c;
    --accent:#7aa2f7;
    --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         -webkit-text-size-adjust:100%; }

  #app { display:flex; flex-direction:column; height:100%; }

  header { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
           padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top,0px));
           background:var(--panel); border-bottom:1px solid var(--line);
           flex:none; }
  h1 { font-size:13px; font-weight:600; margin:0 4px 0 0; }
  .pill { font:11px/1 var(--mono); padding:5px 8px; border-radius:999px;
          border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.on{color:var(--ok);border-color:#2c5c3c}
  .pill.off{color:var(--bad);border-color:#5c2c2c}
  .pill.mid{color:var(--warn);border-color:#5c4c2c}
  .grow{flex:1}

  /* The screen. Fixed 4:3 so a phone shows the whole thing rather than a
     letterbox of black, and it never grows past half the viewport. */
  #stage { position:relative; background:#000; flex:none;
           aspect-ratio:4/3; max-height:48vh; width:100%;
           display:flex; align-items:center; justify-content:center;
           overflow:hidden; }
  #stage img, #stage canvas { width:100%; height:100%; object-fit:contain;
           image-rendering:pixelated; display:block; }
  /* The last live picture, shown behind the notice when the stream is not
     live. Dimmed so it can never be mistaken for the current screen. */
  #stale { position:absolute; inset:0; filter:grayscale(.6) brightness(.55); }
  #stage.armed { outline:1px solid rgba(90,194,122,.5); outline-offset:-1px; }
  #stage { cursor:pointer; }
  /* The capture hint lives BELOW the picture, never over it. A bar across the
     bottom of the stage sat exactly on the DOS prompt -- the one line you most
     need to read on this machine. Nothing overlays the picture except the
     no-signal notice, and that only when there is no picture to cover. */
  #capbar { flex:none; padding:5px 10px; font:11px/1.4 var(--mono);
            text-align:center; color:var(--dim); background:#171a21;
            border-bottom:1px solid var(--line); transition:color .3s; }
  #capbar.armed { color:var(--ok); }
  #capbar.armed b { color:var(--ok); font-weight:600; }
  #capbar.flash { color:#dfe3ea; transition:none; }
  /* Level meter. Shown whether or not sound is enabled, because "is there
     audio on the wire" is a different question from "can I hear it" -- and on
     a muted phone the meter is the only answer available. */
  #meter { flex:none; display:flex; align-items:center; gap:9px;
           padding:6px 10px; background:#171a21;
           border-bottom:1px solid var(--line); font:10px/1 var(--mono);
           color:var(--dim); }
  #meter button { padding:6px 9px; font-size:11px; }
  #mdb { min-width:6.5ch; text-align:right; }
  #vpct { min-width:4ch; text-align:right; }
  #vol { flex:0 1 130px; min-width:80px; height:20px; accent-color:var(--ok);
         background:transparent; cursor:pointer; }
  #mbar { flex:1; height:6px; background:#0f1116; border-radius:3px;
          overflow:hidden; position:relative; }
  #mrms { position:absolute; left:0; top:0; bottom:0; width:0%;
          background:var(--ok); transition:width .08s linear; }
  #mpeak { position:absolute; top:0; bottom:0; width:2px; background:var(--warn); left:0; }
  #veil { position:absolute; inset:0; display:none; flex-direction:column;
          align-items:center; justify-content:center; gap:6px; padding:16px;
          background:rgba(10,11,14,.85); text-align:center; }
  #veil.show { display:flex; }
  #veil .big { font:600 14px var(--mono); color:var(--warn); }
  #veil .sub { color:var(--dim); font-size:12px; max-width:44ch; }

  /* Key bar: horizontally scrollable so every key stays reachable on a
     narrow screen without wrapping into a wall of buttons. */
  #keys { flex:none; display:flex; gap:5px; overflow-x:auto; padding:7px 8px;
          background:var(--panel); border-bottom:1px solid var(--line);
          scrollbar-width:none; }
  #keys::-webkit-scrollbar { display:none; }
  #keys button { flex:none; }

  button { font:12px/1 system-ui,sans-serif; color:var(--fg); background:#232833;
           border:1px solid var(--line); border-radius:7px; padding:9px 11px;
           cursor:pointer; min-height:36px; touch-action:manipulation; }
  button:active { background:#2d3442; }
  button.sticky { border-color:var(--accent); color:var(--accent);
                  background:#20283a; }
  button.danger:active { border-color:var(--bad); color:#ffb4b4; }
  button.primary { border-color:var(--ok); color:var(--ok); }

  #body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
          padding-bottom:calc(12px + var(--safe-b)); }
  @media (min-width:900px) {
    #app { display:grid; grid-template-columns:minmax(0,1fr) 340px;
           grid-template-rows:auto 1fr; height:100vh; }
    header { grid-column:1/-1; }
    #stage { grid-row:2; aspect-ratio:auto; max-height:none; height:100%; }
    #keys { grid-column:1; grid-row:3; }
    #body { grid-column:2; grid-row:2/4; border-left:1px solid var(--line);
            background:var(--panel); }
  }

  section { padding:10px 12px; border-bottom:1px solid var(--line); }
  h2 { font:600 11px/1 system-ui; letter-spacing:.09em; text-transform:uppercase;
       color:var(--dim); margin:0 0 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .kv { display:flex; justify-content:space-between; gap:10px;
        font:12px/1.8 var(--mono); }
  .kv span:last-child { color:var(--dim); }
  #log { padding:6px 12px; font:11px/1.55 var(--mono); }
  #log div { display:flex; gap:7px; padding:1px 0; }
  #log .t { color:#5b6373; flex:none; }
  #log .k { flex:none; width:10ch; overflow:hidden; }
  #log .d { color:var(--dim); word-break:break-all; }
  .k-cmd{color:var(--accent)} .k-lock{color:var(--warn)}
  .k-taint{color:var(--bad);font-weight:600} .k-vid{color:var(--ok)}

  /* Off-screen but focusable: focusing it is what summons the iOS keyboard.
     It must not be display:none or hidden, or the keyboard will not appear. */
  #ghost { position:absolute; opacity:0; height:1px; width:1px;
           padding:0; border:0; left:-9999px; top:0;
           font-size:16px; /* <16px makes iOS zoom the page on focus */ }
</style>

<div id="app">
  <header>
    <h1>vcctrl-kvm</h1>
    <span id="p-video" class="pill">video …</span>
    <span id="p-lock"  class="pill">lock …</span>
    <span id="p-power" class="pill">power …</span>
    <span id="p-xport" class="pill">…</span>
    <span id="p-kbd" class="pill">keyboard idle</span>
    <span id="p-audio" class="pill">sound off</span>
    <span class="grow"></span>
    <button id="kbtn" class="primary">⌨ Keyboard</button>
  </header>

  <div id="stage">
    <canvas id="screen" width="640" height="480"></canvas>
    <img id="mjpeg" style="display:none" alt="">
    <img id="stale" style="display:none" alt="">
    <div id="veil">
      <div class="big" id="veil-title">connecting…</div>
      <div class="sub" id="veil-sub"></div>
      <div class="sub" id="veil-age"></div>
    </div>
  </div>

  <div id="capbar">click the screen to capture the keyboard</div>

  <div id="meter">
    <button id="sbtn">🔇 Sound</button>
    <div id="mbar" title="relative level — a volume knob sits in the signal path">
      <div id="mrms"></div><div id="mpeak"></div>
    </div>
    <span id="mdb">—</span>
    <input id="vol" type="range" min="0" max="100" step="1" value="80"
           aria-label="volume">
    <span id="vpct">80%</span>
  </div>

  <div id="keys">
    <button data-mod="lctrl">Ctrl</button>
    <button data-mod="lalt">Alt</button>
    <button data-mod="lshift">Shift</button>
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="enter">↵</button>
    <button data-key="backspace">⌫</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="f1">F1</button><button data-key="f2">F2</button>
    <button data-key="f3">F3</button><button data-key="f4">F4</button>
    <button data-key="f5">F5</button><button data-key="f6">F6</button>
    <button data-key="f7">F7</button><button data-key="f8">F8</button>
    <button data-key="f9">F9</button><button data-key="f10">F10</button>
    <button data-combo="ctrl,alt,delete" class="danger">C-A-Del</button>
  </div>

  <div id="body">
    <section>
      <h2>Type</h2>
      <div class="row">
        <input id="line" placeholder="type a command, press send"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               style="flex:1;min-width:140px;font:13px var(--mono);
                      background:#12141a;color:var(--fg);
                      border:1px solid var(--line);border-radius:7px;
                      padding:9px 10px">
        <button id="sendline" class="primary">Send ↵</button>
      </div>
    </section>

    <section>
      <h2>Power</h2>
      <div class="row">
        <button data-power="on">On</button>
        <button data-power="off" class="danger">Off</button>
        <button data-power="cycle" class="danger">Cycle</button>
        <button id="refresh">Refresh video</button>
      </div>
    </section>

    <section>
      <h2>State</h2>
      <div class="kv"><span>running</span><span id="s-inflight">–</span></div>
      <div class="kv"><span>last event</span><span id="s-lastev">–</span></div>
      <div class="kv"><span>frames</span><span id="s-frames">–</span></div>
      <div class="kv"><span>viewers</span><span id="s-viewers">–</span></div>
      <div class="kv"><span>transport</span><span id="s-xport">–</span></div>
    </section>

    <h2 style="padding:10px 12px 0">Activity</h2>
    <div id="log"></div>
  </div>
</div>

<input id="ghost" autocapitalize="off" autocorrect="off" spellcheck="false"
       autocomplete="off" enterkeyhint="enter">

<script>
const $ = id => document.getElementById(id);
const cv = $('screen'), ctx = cv.getContext('2d', {alpha:false});
const img = $('mjpeg'), veil = $('veil'), ghost = $('ghost');

// ------------------------------------------------------------------ transport
// Two paths, because the WebSocket came up blank on an iPhone while the
// server-side handshake was provably fine, and a KVM that shows nothing is
// worth less than one that shows something a little later. The socket is
// preferred (full rate, carries input); if it has not delivered a frame within
// a few seconds, an <img> pointed at multipart/x-mixed-replace takes over --
// no JS decoding, no canvas, the browser does all of it.
let ws, wsAlive = false, xport = 'connecting', frames = 0, fpsWin = [];
let firstFrameTimer = null, lastFrameAt = 0, wsTried = 0;

function setXport(x) {
  xport = x;
  const label = {ws:'websocket', mjpeg:'mjpeg fallback',
                 connecting:'connecting…', down:'no video'}[x] || x;
  $('s-xport').textContent = label;
  pill('p-xport', x === 'ws' ? 'on' : x === 'mjpeg' ? 'mid' : 'off', label);
}

function gotFrame() {
  frames++;
  const now = performance.now();
  lastFrameAt = Date.now();
  fpsWin.push(now);
  while (fpsWin.length && now - fpsWin[0] > 2000) fpsWin.shift();
  if (firstFrameTimer) { clearTimeout(firstFrameTimer); firstFrameTimer = null; }
}

function useMjpeg(why) {
  if (xport === 'mjpeg') return;
  setXport('mjpeg');
  addLine(new Date(), 'transport', 'websocket ' + why + ' — using mjpeg', 'k-lock');
  cv.style.display = 'none';
  img.style.display = '';
  // Cache-buster: without it Safari may reuse a dead stream on reconnect.
  img.src = '/stream.mjpg?fps=15&t=' + Date.now();
  img.onload = gotFrame;
  // A dead multipart stream renders as a broken-image icon and stays that way
  // forever. That is what a suspended iOS tab produces on return, and it is
  // indistinguishable from "the machine is off" to anyone looking at it --
  // exactly the lie this tool exists to not tell.
  img.onerror = () => { addLine(new Date(),'transport','stream dropped — restarting','k-lock'); restart(); };
}

function connect() {
  let sock;
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    sock = new WebSocket(`${proto}://${location.host}/ws`);
  } catch (e) { useMjpeg('threw: ' + e); return; }
  ws = sock;
  ws.binaryType = 'arraybuffer';

  // If the socket opens but never delivers, that is still a failure. Judge on
  // frames, not on the connection state -- the difference matters here.
  firstFrameTimer = setTimeout(() => useMjpeg('delivered no frame in 4s'), 4000);

  ws.onopen = () => {
    wsAlive = true;
    // Ask for a rate suited to the device. A phone on cellular does not want
    // 30 fps of a 70 KB screen, and the server drops rather than queues
    // anyway -- asking for less simply wastes less.
    const small = Math.min(screen.width, screen.height) < 500;
    ws.send(JSON.stringify({t:'rate', fps: small ? 12 : 25}));
  };
  ws.onerror = () => { useMjpeg('errored'); };
  ws.onclose = () => {
    wsAlive = false;
    if (xport !== 'mjpeg') setTimeout(connect, 1500);
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') return;
    if (!wsAlive) return;
    if (xport === 'mjpeg') return;
    if (xport !== 'ws') { setXport('ws'); img.style.display='none'; cv.style.display=''; }
    createImageBitmap(new Blob([ev.data], {type:'image/jpeg'})).then(bmp => {
      if (cv.width !== bmp.width) { cv.width = bmp.width; cv.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      gotFrame();
    }).catch(() => useMjpeg('could not decode a frame'));
  };
}
setXport('connecting');
connect();

// Tear everything down and start again from the preferred transport. Called
// on resume, on a broken stream, and by the button. It retries the WEBSOCKET
// each time rather than staying on the fallback forever: falling back is a
// judgement about one moment, and the moment passes.
function restart() {
  if (firstFrameTimer) { clearTimeout(firstFrameTimer); firstFrameTimer = null; }
  try { wsAlive = false; ws && ws.close(); } catch (e) {}
  img.onerror = null;
  img.src = '';
  img.style.display = 'none';
  cv.style.display = '';
  setXport('connecting');
  lastFrameAt = Date.now();
  connect();
}
$('refresh').onclick = restart;

// iOS suspends a backgrounded tab: sockets close, the multipart stream dies,
// and neither comes back on its own. Returning to the tab must restore the
// picture without a manual reload -- a KVM you have to reload is one you
// cannot trust to be showing now.
addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  restart();
  // The audio context suspends with the tab and does not resume itself.
  if (soundOn) { if (ac && ac.state === 'suspended') ac.resume(); if (!aws) startAudio(); }
});
addEventListener('pageshow', e => { if (e.persisted) restart(); });
addEventListener('online', restart);

// Last resort: if the page is visible and no frame has arrived in 8s, whatever
// transport is running has silently died. Judge on frames, not on the state of
// the connection object -- a socket that reports open and delivers nothing is
// the failure mode that started all this.
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (xport === 'connecting') return;
  if (Date.now() - lastFrameAt > 8000) {
    addLine(new Date(), 'transport', 'no frames for 8s — restarting', 'k-lock');
    restart();
  }
}, 4000);

// ------------------------------------------------------------------ input
function send(o) {
  if (wsAlive && xport === 'ws') { ws.send(JSON.stringify(o)); return; }
  // The mjpeg path carries no input, so fall back to the HTTP command
  // endpoint. Slower per keystroke, but it means input never depends on
  // which video transport happened to win.
  if (o.t === 'down') post('keydown', {key:o.k});
  else if (o.t === 'up') post('keyup', {key:o.k});
}

async function post(cmd, body) {
  try {
    const r = await fetch('/cmd', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({cmd}, body))});
    const j = await r.json();
    if (!j.ok) note(j.error || 'refused');
    return j;
  } catch (e) { note(String(e)); }
}

// Sticky modifiers. Tap Ctrl, then a key: the pair goes as one chord. This is
// how a touch screen sends a chord at all, and on desktop it covers the chords
// Firefox and Safari reserve for themselves -- Keyboard Lock is Chromium-only,
// so those keys never reach the page however it is written.
const mods = new Set();
function tapKey(k) {
  if (mods.size) {
    post('combo', {keys:[...mods, k]});
    mods.clear();
    document.querySelectorAll('[data-mod]').forEach(b => b.classList.remove('sticky'));
  } else {
    post('key', {keys:[k]});
  }
}
document.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => {
  const m = b.dataset.mod;
  if (mods.has(m)) { mods.delete(m); b.classList.remove('sticky'); }
  else { mods.add(m); b.classList.add('sticky'); }
});
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => tapKey(b.dataset.key));
document.querySelectorAll('[data-combo]').forEach(b => b.onclick = () =>
  post('combo', {keys:b.dataset.combo.split(',')}));
document.querySelectorAll('[data-power]').forEach(b => b.onclick = () => {
  const a = b.dataset.power;
  // ON confirms too, which is not the obvious choice -- switching a machine on
  // is not destructive to data. It is confirmed because of what this
  // particular machine is: the operator has had the case open repeatedly to
  // swap video cards, and energising a board somebody's hands are inside is a
  // worse outcome than any lost sweep. The wording says so rather than
  // reciting a generic warning.
  const WARN = {
    on:    'Switch the vcctrl-kvm target ON?\n\nMake sure the case is closed and nobody is working inside it.',
    off:   'Power OFF the vcctrl-kvm target?\n\nIf a sweep is running this will destroy it.',
    cycle: 'Power CYCLE the vcctrl-kvm target?\n\nRails drop for 15s and it takes ~90s to reach a prompt. If a sweep is running this will destroy it.',
  };
  if (!confirm(WARN[a] || `Power ${a}?`)) return;
  post('power', {action:a});
});

// -- the line box: the reliable way to type on a phone -----------------------
// A virtual keyboard does not produce usable keydown events for every key, and
// autocorrect rewrites text after the fact. Sending a whole line on submit
// sidesteps both, and it matches how you actually drive DOS: a command, then
// Enter.
$('sendline').onclick = sendLine;
$('line').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendLine(); }
});
async function sendLine() {
  const el = $('line'), s = el.value;
  if (!s) { post('key', {keys:['enter']}); return; }
  await post('type', {text:s});
  await post('key', {keys:['enter']});
  el.value = '';
}

// -- live keyboard ----------------------------------------------------------
// Desktop: capture physical keys by e.code. Mobile: focusing the off-screen
// input summons the system keyboard, and its characters arrive as `input`
// events rather than as usable keydowns.
const CODE = {
  Enter:'enter', Escape:'esc', Backspace:'backspace', Tab:'tab', Space:'space',
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  Home:'home', End:'end', PageUp:'pgup', PageDown:'pgdn',
  Insert:'insert', Delete:'delete',
  ShiftLeft:'lshift', ShiftRight:'rshift', ControlLeft:'lctrl',
  ControlRight:'rctrl', AltLeft:'lalt', AltRight:'ralt',
  CapsLock:'capslock', NumLock:'numlock', ScrollLock:'scrolllock',
  Minus:'minus', Equal:'equal', BracketLeft:'leftbrace',
  BracketRight:'rightbrace', Backslash:'backslash', Semicolon:'semicolon',
  Quote:'apostrophe', Backquote:'grave', Comma:'comma', Period:'dot',
  Slash:'slash', IntlBackslash:'102nd', ContextMenu:'menu',
  MetaLeft:'leftmeta', MetaRight:'rightmeta', Pause:'pause', PrintScreen:'sysrq',
  NumpadAdd:'kpplus', NumpadSubtract:'kpminus', NumpadMultiply:'kpasterisk',
  NumpadDivide:'kpslash', NumpadDecimal:'kpdot', NumpadEnter:'kpenter',
};
for (let i=1;i<=12;i++) CODE['F'+i] = 'f'+i;
for (const c of 'abcdefghijklmnopqrstuvwxyz') CODE['Key'+c.toUpperCase()] = c;
for (let i=0;i<=9;i++) { CODE['Digit'+i]=''+i; CODE['Numpad'+i]='kp'+i; }

let armed = false;
const pressed = new Set();

// Click the screen to capture, a chord to let go -- the VNC/VirtualBox model.
// Capture deliberately does NOT end on blur or on clicking elsewhere: a
// keyboard that silently stops being captured is worse than one that needs an
// explicit release, because you find out by typing into the wrong machine.
const RELEASE = {ctrl:['lctrl','rctrl'], alt:['lalt','ralt'], shift:['lshift','rshift']};
function isReleaseChord() {
  return Object.values(RELEASE).every(names => names.some(n => pressed.has(n)));
}

function setArmed(v, opts) {
  if (armed === v) return;
  armed = v;
  $('stage').classList.toggle('armed', v);
  $('kbtn').classList.toggle('sticky', v);
  $('kbtn').textContent = v ? '⌨ capturing' : '⌨ Keyboard';
  if (v) {
    // Focusing the off-screen input is what summons the on-screen keyboard on
    // a touch device. On desktop it is harmless and keeps key events flowing
    // to one place.
    ghost.focus({preventScroll:true});
    pill('p-kbd', 'on', 'keyboard captured');
    $('capbar').classList.add('armed');
    $('capbar').innerHTML = 'keyboard captured — press <b>Ctrl + Alt + Shift</b> to release';
    if (!opts || !opts.quiet)
      addLine(new Date(), 'ui', 'keyboard captured — Ctrl+Alt+Shift releases',
              'k-lock');
  } else {
    pill('p-kbd', '', 'keyboard idle');
    $('capbar').classList.remove('armed');
    $('capbar').textContent = 'click the screen to capture the keyboard';
    ghost.blur();
    // Anything still held goes up, on this side and at the g2k. Releasing
    // capture with a key down would leave it down at a DOS prompt, typing
    // until the buffer fills.
    for (const k of pressed) send({t:'up', k});
    pressed.clear();
    post('release_all', {});
    if (!opts || !opts.quiet)
      addLine(new Date(), 'ui', 'keyboard released', 'k-lock');
  }
}
// Capture-phase, so nothing layered over the video can swallow the click, and
// pointerup as well as click because a touch that moves slightly may not
// produce a click at all.
function armFromStage() {
  if (armed) {
    // Already captured. Do not silently do nothing -- the previous build's
    // real bug was invisible state, so say what is true.
    const b = $('capbar');
    b.classList.add('flash');
    setTimeout(() => b.classList.remove('flash'), 90);
    return;
  }
  setArmed(true);
}
$('stage').addEventListener('click', armFromStage, true);
$('stage').addEventListener('pointerup', armFromStage, true);
$('kbtn').onclick = () => setArmed(!armed);

// Text from a virtual keyboard, dictation or autocorrect.
ghost.addEventListener('input', () => {
  const s = ghost.value;
  ghost.value = '';
  if (s) post('type', {text:s});
});
ghost.addEventListener('keydown', e => {
  // On desktop the window-level capture path above already handles this key,
  // so doing anything here would send it twice. Only the soft-keyboard case
  // reaches the rest of this handler.
  if (armed && e.code) return;
  const k = e.key === 'Enter' ? 'enter'
          : e.key === 'Backspace' ? 'backspace' : CODE[e.code];
  if (!k || (e.key.length === 1 && !e.ctrlKey && !e.altKey)) return;
  e.preventDefault();
  tapKey(k);
});

const typingHere = t => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')
                            && t !== ghost;

// Backspace outside a text field still means "go back" in some browsers, and
// navigating away from a KVM by mistyping is a bad way to lose sight of a
// machine. Blocked unconditionally -- not only while captured -- because the
// accident happens exactly when you thought you were captured and were not.
// The same goes for the other keys a browser treats as navigation.
addEventListener('keydown', e => {
  if (typingHere(e.target)) return;
  if (e.key === 'Backspace'
      || (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight'))) {
    e.preventDefault();
  }
}, {capture:true});

addEventListener('keydown', e => {
  if (!armed || typingHere(e.target)) return;
  const k = CODE[e.code];
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;          // the target does its own repeat
  pressed.add(k);
  if (isReleaseChord()) {
    // Do NOT forward the key that completed the chord. The modifiers already
    // went down at the g2k, so setArmed(false) lifts them there before letting
    // go -- otherwise Ctrl and Alt stay stuck down on a machine we are no
    // longer listening to.
    setArmed(false);
    return;
  }
  send({t:'down', k});
}, {capture:true});

addEventListener('keyup', e => {
  const k = CODE[e.code];
  if (!k) return;
  pressed.delete(k);
  if (!armed || typingHere(e.target)) return;
  e.preventDefault();
  send({t:'up', k});
}, {capture:true});

// A window that loses focus while captured cannot see keyup, so a held key
// would never be lifted. Drop what we think is held rather than stranding it.
addEventListener('blur', () => {
  if (!armed || !pressed.size) return;
  for (const k of pressed) send({t:'up', k});
  pressed.clear();
});

// ------------------------------------------------------------------ audio
// Raw S16LE at 48 kHz on its own socket. No decode: the capture hardware does
// 48 kHz and nothing else, which is exactly what an AudioContext wants, so
// nothing resamples anywhere.
//
// Playback schedules AudioBuffers at a running cursor rather than using an
// AudioWorklet, because AudioWorklet is a SECURE-CONTEXT api and this page is
// served over plain http. That is not a Safari bug and no amount of debugging
// the audio graph will find it -- see docs/WEBKVM-AUDIO.md sec. 5.
let ac = null, aws = null, gain = null, cursor = 0, soundOn = false;
// Volume is remembered across reloads. Losing it every time the tab is
// refreshed would be its own small annoyance, and this page gets reloaded a
// lot while a machine is being watched.
let volume = (() => {
  const v = parseInt(localStorage.getItem('vcctrl.vol'), 10);
  return isNaN(v) ? 80 : Math.max(0, Math.min(100, v));
})();
const LEAD = 0.12;        // jitter buffer, seconds
const MAX_AHEAD = 0.45;   // beyond this we are accumulating delay, not buffering

// Perceived loudness is roughly the square of the amplitude ratio, so a linear
// slider on raw gain spends most of its travel in the top few dB and feels
// broken at the quiet end.
const gainFor = pct => (pct / 100) ** 2;

function applyVolume() {
  $('vol').value = volume;
  $('vpct').textContent = volume + '%';
  localStorage.setItem('vcctrl.vol', String(volume));
  // setTargetAtTime rather than assigning .value: a step change in gain is an
  // audible click, which is exactly what you do not want while listening for
  // whether a sound effect fired.
  if (gain && ac) {
    try { gain.gain.setTargetAtTime(gainFor(volume), ac.currentTime, 0.015); }
    catch (e) { gain.gain.value = gainFor(volume); }
  }
}
$('vol').addEventListener('input', () => {
  volume = parseInt($('vol').value, 10) || 0;
  applyVolume();
});

function setSound(on) {
  soundOn = on;
  $('sbtn').textContent = on ? '🔊 Sound' : '🔇 Sound';
  $('sbtn').classList.toggle('primary', on);
  pill('p-audio', on ? 'on' : '', on ? 'sound on' : 'sound off');
  applyVolume();
  // Off stops the STREAM, not just the output: silence still costs 1.5 Mbit/s,
  // and there is no reason to carry it to a viewer who is not listening. The
  // consequence is that the meter goes quiet too, which is why the daemon's
  // own audio state is still reported in the header pill while sound is off.
  if (on) startAudio(); else stopAudio();
}

$('sbtn').onclick = () => {
  // resume() must happen inside the gesture handler, not after an await, or
  // both target browsers leave the context suspended.
  if (!soundOn && !ac) {
    try { ac = new AudioContext({sampleRate: 48000}); }
    catch (e) { ac = new AudioContext(); }
    gain = ac.createGain();
    gain.gain.value = gainFor(volume);
    gain.connect(ac.destination);
  }
  if (ac && ac.state === 'suspended') ac.resume();
  setSound(!soundOn);
};

function stopAudio() {
  if (aws) { try { aws.onclose = null; aws.close(); } catch (e) {} aws = null; }
  cursor = 0;
  mSmooth = -91;
  $('mrms').style.width = '0%';
  $('mpeak').style.left = '0%';
  $('mdb').textContent = '—';
}

function startAudio() {
  if (aws) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  aws = new WebSocket(`${proto}://${location.host}/wsaudio`);
  aws.binaryType = 'arraybuffer';
  aws.onclose = () => { aws = null; if (soundOn) setTimeout(startAudio, 1200); };
  aws.onerror = () => { try { aws.close(); } catch (e) {} };
  aws.onmessage = ev => {
    const pcm = new Int16Array(ev.data);
    meter(pcm);
    if (!soundOn || !ac) return;
    const frames = pcm.length >> 1;
    if (!frames) return;
    // 48000 explicitly, not ac.sampleRate: if the context ended up at 44100
    // (iOS has historically done this) the browser resamples on playback,
    // which is correct and free. Using ac.sampleRate here would play it at
    // the wrong pitch instead.
    const buf = ac.createBuffer(2, frames, 48000);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    for (let i = 0; i < frames; i++) {
      L[i] = pcm[2 * i] / 32768;
      R[i] = pcm[2 * i + 1] / 32768;
    }
    const now = ac.currentTime;
    if (cursor < now + 0.005) cursor = now + LEAD;   // underran: resync
    else if (cursor > now + MAX_AHEAD) return;       // too far ahead: drop
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(gain);
    src.start(cursor);
    cursor += buf.duration;
  };
}

// The meter runs off the same samples, so it costs one pass and no requests.
// It reports RELATIVE level only: a physical volume knob sits in the signal
// path (FINDINGS 11), so absolute dB is not comparable between sessions and
// must never be fed into a comparison.
let mSmooth = -91;
function meter(pcm) {
  let peak = 0, sum = 0;
  const step = Math.max(1, pcm.length / 2048 | 0);
  let n = 0;
  for (let i = 0; i < pcm.length; i += step) {
    const v = pcm[i]; const a = v < 0 ? -v : v;
    if (a > peak) peak = a;
    sum += v * v; n++;
  }
  const rms = Math.sqrt(sum / Math.max(1, n));
  const db = v => v > 0 ? 20 * Math.log10(v / 32768) : -91;
  const rdb = db(rms), pdb = db(peak);
  mSmooth = Math.max(rdb, mSmooth - 3);
  const pct = v => Math.max(0, Math.min(100, (v + 70) / 70 * 100));
  $('mrms').style.width = pct(mSmooth) + '%';
  $('mpeak').style.left = pct(pdb) + '%';
  $('mdb').textContent = rdb <= -90 ? 'silent' : rdb.toFixed(0) + 'dB';
}

// ------------------------------------------------------------------ log
let seq = 0;
const logEl = $('log');
const CLS = k => k.startsWith('lock.broken') ? 'k-taint'
  : (k.startsWith('lock') || k === 'input.refused') ? 'k-lock'
  : k.startsWith('video') ? 'k-vid' : 'k-cmd';
function note(t) { addLine(new Date(), 'ui', t, 'k-lock'); }
function addLine(d, kind, detail, cls) {
  const row = document.createElement('div');
  row.innerHTML = `<span class="t">${d.toTimeString().slice(0,8)}</span>`
    + `<span class="k ${cls||CLS(kind)}">${kind}</span><span class="d"></span>`;
  row.lastChild.textContent = detail || '';
  logEl.insertBefore(row, logEl.firstChild);
  while (logEl.children.length > 250) logEl.removeChild(logEl.lastChild);
}
async function pollEvents() {
  try {
    const j = await (await fetch('/events?since=' + seq)).json();
    if (j.missed) note('— gap in log, some events were not seen —');
    for (const e of (j.events||[])) {
      seq = Math.max(seq, e.seq);
      let d = e.kind === 'cmd' ? `${e.cmd} ${e.detail||''}`.trim() + (e.by?`  ←${e.by}`:'')
            : Object.entries(e).filter(([k])=>!['seq','t','kind'].includes(k))
                .map(([k,v])=>`${k}=${v}`).join(' ');
      addLine(new Date(e.t*1000), e.kind, d);
    }
  } catch (e) {}
}

// The last frame that was positively live, dimmed, behind the notice. Without
// it the viewer gets a black rectangle, which is indistinguishable from a
// machine that is switched off -- and the freshest real picture is often the
// most useful thing on screen, especially with the Mach64 fitted, where a
// whole game run never locks and the prompts either side are all there is.
let staleAt = 0;
async function showStale() {
  const el = $('stale');
  if (Date.now() - staleAt > 5000) {
    staleAt = Date.now();
    try {
      const r = await fetch('/lastgood.jpg?t=' + staleAt);
      if (r.ok) {
        const age = Number(r.headers.get('X-Frame-Age'));
        el.src = URL.createObjectURL(await r.blob());
        el.style.display = '';
        $('veil-age').textContent = 'showing the last live picture, '
          + fmtAge(age) + ' old';
        return;
      }
    } catch (e) {}
    el.style.display = 'none';
    $('veil-age').textContent = 'no live picture has been seen yet';
  }
}
function hideStale() {
  $('stale').style.display = 'none';
  staleAt = 0;
}

// ------------------------------------------------------------------ status
const fmtAge = s => s == null ? '–' : s < 90 ? s.toFixed(0)+'s'
  : s < 5400 ? (s/60).toFixed(1)+'m' : (s/3600).toFixed(1)+'h';
function pill(id, cls, text) {
  const el = $(id); el.className = 'pill ' + cls; el.textContent = text;
}
async function pollState() {
  let j;
  try { j = await (await fetch('/state.json')).json(); }
  catch (e) { pill('p-video','off','daemon unreachable'); return; }
  const v = j.video || {};
  if (v.state === 'locked') {
    pill('p-video','on','video locked');
    veil.classList.remove('show');
    hideStale();
  } else {
    pill('p-video','mid','video ' + (v.state||'?'));
    const T = {nosignal:'no signal', frozen:'frozen — not live',
               starting:'waiting for first frame'};
    $('veil-title').textContent = T[v.state] || v.state || '—';
    $('veil-sub').textContent = v.state === 'frozen'
      ? 'Frames are still arriving but every one is byte-identical, so the '
      + 'capture stick is repeating rather than drawing. DOS text mode 03h '
      + 'does this, and what it repeats is a flat black frame — not the last '
      + 'real screen.'
      : v.state === 'nosignal'
      ? 'No frames are arriving. On this rig that is often correct: with the '
      + 'Mach64 fitted, a game run at 512x384 is outside the capture stick.'
      : '';
    showStale();
    veil.classList.add('show');
  }
  const L = j.lock || {};
  pill('p-lock', L.owner ? 'mid' : 'on',
       L.owner ? `held by ${L.owner}` : 'input free');
  const inf = j.inflight || [];
  $('s-inflight').textContent = inf.length ? `${inf[0].cmd} · ${fmtAge(inf[0].age_s)}` : 'idle';
  $('s-lastev').textContent = fmtAge(j.last_event_age_s);
  $('s-frames').textContent = v.frames ?? '–';
  $('s-viewers').textContent = j.viewers ?? '–';
  const A = j.audio || {};
  if (!soundOn) {
    // Even with sound off, say whether the capture path is alive. "silent" and
    // "the ALSA device died" look identical otherwise.
    pill('p-audio', A.state === 'capturing' ? '' : 'mid',
         A.state === 'capturing' ? 'sound off' : 'audio ' + (A.state || '?'));
  }
}
async function pollPower() {
  const j = await post('power', {action:'state'});
  if (j && j.ok) pill('p-power', j.power.on?'on':'off', 'power ' + (j.power.on?'on':'off'));
}
applyVolume();
setInterval(pollState, 1500);
setInterval(pollEvents, 1500);
setInterval(pollPower, 20000);
pollState(); pollEvents(); pollPower();
</script>
