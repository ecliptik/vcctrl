# Bounds on what systemd-coredump keeps, installed to
# /etc/systemd/coredump.conf.d/. The defaults are a fraction of the disk, which
# on a 59 GB card is several gigabytes -- fine until the fault being captured is
# a crash LOOP, where Restart=always and a repeating abort will write a core
# every two seconds for as long as it takes somebody to notice.
#
# vcctrld's RSS is ~95 MB, so a core compresses to well under 100 MB and 2 GB
# holds many. KeepFree is the backstop that matters: filling the card is worse
# than losing the twentieth copy of the same crash.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=2G
ExternalSizeMax=2G
MaxUse=2G
KeepFree=4G
