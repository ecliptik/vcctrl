# vcctrl: no login prompts on the Pi's virtual consoles. The vcctrl virtual
# keyboard is a keyboard to THIS Pi too, so every command typed at the DOS
# box was also typed into tty1's login prompt: 69 "FAILED LOGIN ... FOR
# C:\MTCP\VCCHK.BAT ..." lines in one boot (2026-11-05), each a copy of
# what was typed, in the Pi's journal. An Alt+F2..F6 would spawn a fresh
# getty on that VT the same way. getty@tty1 is masked by pi/install.sh; this
# stops logind spawning the others. Emergency access is the serial console
# (ttyAMA10) and ssh; a keyboard plugged into the Pi goes to the target via
# USB4VC anyway. Installed as /etc/systemd/logind.conf.d/vcctrl-novt.conf.
[Login]
NAutoVTs=0
ReserveVT=0
