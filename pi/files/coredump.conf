# WHY A DAEMON THAT ABORTS MUST LEAVE A CORE
#
# 2026-08-20 23:09:03 vcctrld died with one line -- "double free or corruption
# (top)", status 6/ABRT -- and took a running cell with it. That message comes
# from glibc's heap allocator, so no Python code produced it directly; it came
# from a C extension, and the frame path runs through Pillow's JPEG decode in
# four places across three kinds of thread. Which one, and doing what, was
# unrecoverable. There was no core, so there was no investigation.
#
# LimitCORE=infinity here is not redundant with the systemd default. `systemctl
# show` reports LimitCORE=infinity out of the box, and that is the HARD limit;
# Debian's SOFT limit is 0, and the kernel checks the soft limit before it will
# write anything -- with or without systemd-coredump installed. Reading the
# hard limit and concluding cores were enabled is exactly the kind of two-
# valued check that reports the instrument's state as the target's. Confirm it
# on the RUNNING process instead:
#
#     grep 'Max core' /proc/$(systemctl show vcctrld -p MainPID --value)/limits
#
# Both columns must read unlimited. A limit is set at exec, so this takes
# effect on the next restart and not on daemon-reload.
[Service]
LimitCORE=infinity
