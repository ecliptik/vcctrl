[Journal]
# Applied at BUILD time on this machine, not after an outage.
#
# On the Pi 3 this rig lost its ssh control path repeatedly: journald blocked
# in writev() on /dev/console (measured -- fd 41, file_tty_write, every sample
# of a stall), stopped draining its sockets, and sshd/PAM/sudo all blocked
# behind it. The console was console=tty1 with ixon enabled, and the vcctrl
# virtual keyboard is a keyboard to THE PI as well as to the DOS target -- so a
# Ctrl-S aimed at the g2k was XOFF on the Pi's own console. See FINDINGS 28.
#
# This machine has the same console=tty1 exposure, so the same guards go on
# before the virtual keyboard exists rather than after it bites.
ForwardToConsole=no
MaxLevelConsole=emerg
ForwardToWall=no
MaxLevelWall=emerg

# Bounded so the journal cannot grow without limit on flash storage. Not a fix
# for anything -- the Pi 3's 824M journal was a red herring that cost two hours
# -- just hygiene.
SystemMaxUse=200M
SystemMaxFileSize=32M
SystemMaxFiles=12
RuntimeMaxUse=32M
